version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../core
  design_system:
    path: ../../design_system
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.0.2
  get_it: ^9.3.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  dio: ^5.11.1
