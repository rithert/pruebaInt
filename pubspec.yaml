name: fintech_workspace
description: Monorepo de la plataforma financiera digital (app shell + módulos por dominio).
publish_to: none

environment:
  sdk: ^3.13.0

# Dart pub workspaces: una sola resolución de dependencias para todo el monorepo.
# Cada módulo declara `resolution: workspace` en su pubspec.
workspace:
  - apps/super_app
  - packages/core
  - packages/design_system
  - packages/features/auth
  - packages/features/accounts

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.0.0

melos:
  repository: https://github.com/OWNER/REPO
  # SDK fijado por FVM (.fvmrc). En CI se sobrescribe con MELOS_SDK_PATH.
  sdkPath: .fvm/flutter_sdk
  scripts:
    analyze:
      description: Análisis estático de todos los paquetes.
      run: dart analyze --fatal-infos .
    format:
      description: Formatea el código fuente de todos los paquetes.
      run: dart format apps/super_app/lib apps/super_app/test packages
    format:check:
      description: Verifica formato sin modificar archivos.
      # Rutas explícitas: `.` recorrería apps/super_app/build (salida de
      # Gradle), cuyas rutas superan el límite de Windows.
      run: dart format --output=none --set-exit-if-changed apps/super_app/lib apps/super_app/test packages
    test:
      description: Corre tests de todos los paquetes Flutter que tengan carpeta test/.
      exec: flutter test --coverage
      packageFilters:
        dirExists: test
    test:changed:
      description: Corre tests solo en paquetes con cambios respecto a main (útil en TBD).
      exec: flutter test
      packageFilters:
        dirExists: test
        diff: origin/main
