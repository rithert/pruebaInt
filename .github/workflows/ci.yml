# CI de Trunk Based Development: cada push a main y cada PR de vida corta
# debe dejar el tronco en verde. Los jobs corren en paralelo y solo se
# disparan si cambió su parte del monorepo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'apps/**'
              - 'packages/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - '.fvmrc'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Misma versión que fija FVM en local: una sola fuente de verdad.
          flutter-version-file: .fvmrc
          cache: true
      - name: Dependencias del workspace
        run: |
          flutter pub get
          dart pub global activate melos 8.9.0
          # En CI no hay .fvm: melos usa el SDK que instaló la action.
          echo "MELOS_SDK_PATH=$FLUTTER_ROOT" >> "$GITHUB_ENV"
      - name: Formato
        run: melos run format:check
      - name: Análisis estático
        run: dart analyze --fatal-infos .
      - name: Tests (unitarios y de widgets) con cobertura
        run: melos run test --no-select
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/lcov.info'

  android:
    # Compila el APK SIN google-services.json: prueba que el repo es
    # reproducible sin credenciales (Firebase queda deshabilitado).
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: APK de desarrollo
        working-directory: apps/super_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: super-app-debug-apk
          path: apps/super_app/build/app/outputs/flutter-apk/app-debug.apk

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-image:
    # La imagen de producción arranca, responde /health y NO expone el chaos.
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fintech-bff:ci backend
      - name: Smoke test del contenedor
        run: |
          docker run -d --name bff -p 3000:3000 \
            -e JWT_SECRET=ci-secret-0123456789abcdef0123456789 \
            -e ADMIN_KEY=ci-admin fintech-bff:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/health && break; sleep 1; done
          curl -fs localhost:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-admin-key: ci-admin' localhost:3000/admin/chaos)" = "404"
          docker logs bff
